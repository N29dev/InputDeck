<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InputDeck · OBS Overlay</title>
<style>
:root { font-family: -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif; color-scheme:dark }
* { box-sizing:border-box }
html, body { margin:0; background:transparent!important; overflow:hidden }
.panel { display:flex; position:absolute; top:2px; left:2px; gap:20px; padding:16px 15px 18px; width:499px; height:220px; border-radius:17px;
  background:rgba(12,15,25,var(--panel-opacity,.88)); border:1px solid rgba(255,255,255,.15); }
.block { display:flex; flex-direction:column; gap:7px }
.title { height:13px; text-align:center; font-size:10px; font-weight:700; letter-spacing:.1em; color:rgba(255,255,255,.7) }
.keyboard { width:235px; display:grid; grid-template-columns:repeat(4,55px); grid-auto-rows:38px; gap:5px; align-content:start }
.key { display:flex; align-items:center; justify-content:center; border-radius:8px; background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.09); font-size:13px; font-weight:650; color:#fff; transition:background .065s,border-color .065s }
.key.small { font-size:9px; letter-spacing:.02em }
.key.space { grid-column:1 / -1; font-size:11px; letter-spacing:.1em }
.key.active { background:rgba(61,122,237,.90); border-color:rgba(125,181,255,.95); box-shadow:0 0 12px rgba(40,116,247,.22) }
.trackpad { position:relative; width:213px; flex:1; min-height:150px; border-radius:10px; overflow:hidden;
  background:rgba(26,35,54,.86); border:1px solid rgba(255,255,255,.21) }
.ripple-layer,.fingers-layer { position:absolute; inset:0; pointer-events:none }
.finger { position:absolute; transform:translate(-50%,-50%); width:11px; height:11px; border-radius:50%;
  background:#8dc9ff; box-shadow:0 0 0 11px rgba(75,157,255,.18),0 0 16px rgba(91,179,255,.35) }
.ripple { position:absolute; width:20px; height:20px; border:2px solid rgba(113,190,255,.95);
  border-radius:50%; pointer-events:none; animation:inputdeck-ripple .60s ease-out forwards }
.ripple.trail { animation-name:inputdeck-trail; animation-duration:.43s; border-width:1.5px; border-color:rgba(126,200,255,.72) }
.ripple.click { animation-name:inputdeck-click; animation-duration:.66s; border-color:#b5e1ff; border-width:2px }
@keyframes inputdeck-ripple {
  from { transform:translate(-50%,-50%) scale(.35);opacity:.84 }
  to { transform:translate(-50%,-50%) scale(2.3);opacity:0 }
}
@keyframes inputdeck-trail {
  from { transform:translate(-50%,-50%) scale(.35);opacity:.39 }
  to { transform:translate(-50%,-50%) scale(1.3);opacity:0 }
}
@keyframes inputdeck-click {
  from { transform:translate(-50%,-50%) scale(.35);opacity:1 }
  to { transform:translate(-50%,-50%) scale(2.9);opacity:0 }
}
.msg { position:absolute; inset:0; display:flex; justify-content:center; align-items:center; text-align:center;
  font-size:11px; color:rgba(255,255,255,.55) }
.msg[hidden] { display:none }
.click-markers { position:absolute; z-index:3; pointer-events:none; bottom:8px; left:8px; right:8px;
  display:flex; justify-content:space-between; gap:8px }
.click-marker { display:grid; place-items:center; width:68px; height:20px; border-radius:6px;
  background:rgba(0,0,0,.29); border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.58); font-size:9px; font-weight:700; letter-spacing:.025em }
.click-marker.pressed { color:#fff; background:rgba(61,122,237,.94);
  border-color:rgba(192,221,255,.72) }
.click-marker.flash { animation:inputdeck-click-flash .35s ease-out }
@keyframes inputdeck-click-flash {
  0% { box-shadow:0 0 0 0 rgba(132,202,255,.75); }
  65% { box-shadow:0 0 0 7px rgba(132,202,255,.12); }
  100% { box-shadow:0 0 0 9px transparent; }
}
</style>
</head>
<body>
<div class="panel" id="panel">
  <section class="block"><div class="title">INPUTDECK</div><div class="keyboard" id="keyboard"></div></section>
  <section class="block" id="trackpadBlock"><div class="title">TRACKPAD</div><div class="trackpad" id="trackpad"><div class="ripple-layer" id="ripples"></div><div class="fingers-layer" id="fingers"></div><div class="msg" id="padStatus" hidden>Trackpad unavailable</div><div class="click-markers"><span class="click-marker" id="leftClick">L CLICK</span><span class="click-marker" id="rightClick">R CLICK</span></div></div></section>
</div>
<script>
(() => {
  'use strict';
  const defaults = ['Q','W','E','R','A','S','D','F','Shift','Ctrl','C','V','Space'];
  const panel = document.getElementById('panel');
  const keyboard = document.getElementById('keyboard');
  const padBlock = document.getElementById('trackpadBlock');
  const ripples = document.getElementById('ripples');
  const fingerLayer = document.getElementById('fingers');
  const padStatus = document.getElementById('padStatus');
  const leftClickIndicator = document.getElementById('leftClick');
  const rightClickIndicator = document.getElementById('rightClick');
  let lastTouchPoint = null;
  let lastTouchAt = 0;

  const previousContacts = new Map();
  const trailOrigins = new Map();
  let lastSelected = '';
  let lastClickSerial = null;
  let connected = false;

  const clamp01 = value => Math.max(0,Math.min(1,Number(value) || 0));

  function rippleAt(point, kind = 'touch') {
    const node = document.createElement('i');
    node.className = 'ripple' + (kind === 'touch' ? '' : ' ' + kind);
    node.style.left = (point.x * 100) + '%';
    node.style.top = ((1 - point.y) * 100) + '%';
    ripples.appendChild(node);
    node.addEventListener('animationend', () => node.remove(), {once:true});
    // Prevent extreme multi-touch movement from accumulating unbounded DOM nodes.
    while (ripples.childElementCount > 96) ripples.firstElementChild.remove();
  }

  function renderTouches(state) {
    const available = state.trackpad === true;
    padStatus.hidden = available;
    const next = new Map();
    const contacts = available && Array.isArray(state.fingers) ? state.fingers : [];
    fingerLayer.replaceChildren();

    contacts.forEach((finger, index) => {
      const id = String(finger.id ?? index); // Tolerates older local app builds.
      const point = {x: clamp01(finger.x), y: clamp01(finger.y)};
      lastTouchPoint = point;
      lastTouchAt = performance.now();
      next.set(id, point);
      const before = previousContacts.get(id);
      if (!before) {
        rippleAt(point, 'touch');
        trailOrigins.set(id, point);
      } else {
        const anchor = trailOrigins.get(id) || before;
        const distance = Math.hypot(point.x - anchor.x, point.y - anchor.y);
        if (distance >= 0.055) {
          const steps = Math.min(7, Math.max(1, Math.ceil(distance / 0.07)));
          for (let step = 1; step <= steps; step++) {
            const k = step / steps;
            rippleAt({x: anchor.x + (point.x - anchor.x) * k,
                      y: anchor.y + (point.y - anchor.y) * k}, 'trail');
          }
          trailOrigins.set(id, point);
        }
      }
      const dot = document.createElement('i');
      dot.className = 'finger';
      dot.style.left = (point.x * 100) + '%';
      dot.style.top = ((1 - point.y) * 100) + '%';
      fingerLayer.appendChild(dot);
    });

    const serial = Number(state.clickSerial ?? 0);
    if (lastClickSerial !== null && serial !== lastClickSerial) {
      const pressedSide = state.clickSide === 'right' ? 'right' : 'left';
      const indicator = pressedSide === 'right' ? rightClickIndicator : leftClickIndicator;
      indicator.classList.remove('flash');
      void indicator.offsetWidth; // Restart CSS animation on repeated clicks.
      indicator.classList.add('flash');
      const positions = [...next.values()];
      if (available && positions.length) {
        for (const point of positions) rippleAt(point, 'click');
      } else if (available && lastTouchPoint && performance.now() - lastTouchAt < 250) {
        // Use a very recent contact, not an invented physical click position.
        rippleAt(lastTouchPoint, 'click');
      }
    }
    leftClickIndicator.classList.toggle('pressed', state.leftClick === true);
    rightClickIndicator.classList.toggle('pressed', state.rightClick === true);
    lastClickSerial = serial;
    previousContacts.clear();
    for (const [id, point] of next) previousContacts.set(id, point);
    for (const id of trailOrigins.keys()) if (!next.has(id)) trailOrigins.delete(id);
  }

  function render(state) {
    const selected = Array.isArray(state.selected) ? state.selected : defaults;
    const visible = state.trackpadVisible !== false;
    const signature = JSON.stringify(selected);
    if (signature !== lastSelected) {
      keyboard.replaceChildren();
      const arranged = [...selected.filter(key => key !== 'Space')];
      if (selected.includes('Space')) arranged.push('Space');
      for (const key of arranged) {
        const node = document.createElement('div');
        node.className = 'key' + (key.length > 3 ? ' small' : '') + (key === 'Space' ? ' space' : '');
        node.dataset.key = key;
        node.textContent = key.toUpperCase();
        keyboard.appendChild(node);
      }
      lastSelected = signature;
    }

    const ordinary = selected.filter(key => key !== 'Space').length;
    const rows = Math.ceil(ordinary / 4) + (selected.includes('Space') ? 1 : 0);
    const height = Math.max(224,52 + Math.max(rows,1) * 43);
    panel.style.height = (height - 4) + 'px';
    panel.style.width = visible ? '499px' : '262px';
    panel.style.setProperty('--panel-opacity',String(Math.min(1,Math.max(.4,Number(state.opacity) || .88))));
    padBlock.style.display = visible ? 'flex' : 'none';

    const active = new Set(state.keys || []);
    for (const key of keyboard.children) key.classList.toggle('active',active.has(key.dataset.key));
    renderTouches(state);
  }

  leftClickIndicator.addEventListener('animationend', () => leftClickIndicator.classList.remove('flash'));
  rightClickIndicator.addEventListener('animationend', () => rightClickIndicator.classList.remove('flash'));
  render({selected:defaults,keys:[],fingers:[],clickSerial:0,
          leftClick:false,rightClick:false,trackpad:true,trackpadVisible:true,opacity:.88});
  const stream = new EventSource('/events');
  stream.onmessage = event => {
    try { connected = true; render(JSON.parse(event.data)); } catch (error) { console.warn('InputDeck invalid frame',error); }
  };
  stream.onerror = () => { connected = false; /* EventSource reconnects automatically. */ };

  if (new URLSearchParams(location.search).has('demo')) {
    let frame = 0;
    setInterval(() => {
      if (!connected) {
        frame++;
        render({selected:defaults,keys:['W','Shift','Space'],trackpad:true,
          clickSerial:Math.floor(frame / 18),clickSide:(Math.floor(frame / 18) % 2 === 0 ? 'left' : 'right'),
          leftClick:frame % 18 < 5,rightClick:frame % 36 >= 18 && frame % 36 < 23,
          trackpadVisible:true,
          fingers:[{id:1,x:.42+.27*Math.sin(frame/9),y:.48+.17*Math.cos(frame/12)},
                   {id:2,x:.71,y:.65}],opacity:.88});
      }
    },80);
  }
})();
</script>
</body>
</html>
