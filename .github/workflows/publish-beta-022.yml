name: Publish InputDeck v0.2.2 beta

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-beta-022.yml'

permissions:
  contents: read

jobs:
  build:
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AppleSilicon
            runner: macos-15
          - arch: Intel
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build InputDeck
        run: bash build.sh
      - name: Verify bundle signature
        run: |
          test -x build/InputDeck.app/Contents/MacOS/InputDeck
          codesign --verify --deep --strict build/InputDeck.app
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/InputDeck.app "InputDeck-macOS-${{ matrix.arch }}.zip"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: InputDeck-macOS-${{ matrix.arch }}
          path: InputDeck-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    name: Publish v0.2.2-beta.1
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect prebuilt apps
        uses: actions/download-artifact@v4
        with:
          pattern: InputDeck-macOS-*
          path: dist
          merge-multiple: true
      - name: Create beta release and matching tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.2.2-beta.1
        run: |
          set -euo pipefail
          ls -lah dist/*.zip
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving existing assets untouched."
            exit 0
          fi
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "InputDeck v0.2.2 Beta — keyboard highlighting fix" \
            --notes "Prebuilt, ad-hoc signed macOS apps for Apple Silicon and Intel. Fixed keyboard highlighting with Input Monitoring diagnostics and selected-key polling, plus custom key layouts, OBS support, and live trackpad touches. This beta is not Apple-notarized; macOS may require opening it via Privacy & Security. Source code is included in this repository." \
            --prerelease
