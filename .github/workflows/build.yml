name: macOS Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build with Apple toolchain
        run: bash build.sh
      - name: Package app
        run: ditto -c -k --keepParent build/InputDeck.app InputDeck-macOS.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InputDeck-macOS-beta
          path: InputDeck-macOS.zip
